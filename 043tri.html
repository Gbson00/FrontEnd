<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{/*box level*/
            color: rgb(255, 0, 0);
            text-align: center;
            /*display: inline; pode mudar o elemento box level e vice versa */
            background-color: rgb(140, 0, 0);
            height: 300px;
            width: 300px;
            
            
           
            /* solid e o border style e o px é do width*/
           

            border: 10px solid rgb(90, 0, 0);

            padding: 10px, 20px;

            margin: auto;
            border-radius: 15px;
            outline: px solid rgb(140, 0, 0);;
        
        }

        a{ 
            border: 1px solid black;
            padding: 10px;
        }
  
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
